<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的小站</title>
<meta name="description" content="我的小站 —— 一个支持 Markdown 渲染的个人博客" />
<style>
  :root {
    --bg: #f5fafb;
    --surface: #ffffff;
    --text: #1f2d3d;
    --text-soft: #5b6b7b;
    --muted: #93a4b3;
    --cyan: #16b8c4;
    --cyan-deep: #0e8e98;
    --cyan-soft: #e3f7f8;
    --border: #e6eef0;
    --shadow: 0 6px 24px rgba(22, 184, 196, 0.10);
    --radius: 14px;
    --maxw: 1040px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--cyan-deep); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- Header ---------- */
  header.site {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 19px;
    color: var(--text);
  }
  .brand .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
    box-shadow: 0 0 0 4px var(--cyan-soft);
  }
  nav.links { display: flex; gap: 6px; }
  nav.links a {
    padding: 7px 14px;
    border-radius: 999px;
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 500;
  }
  nav.links a:hover { background: var(--cyan-soft); text-decoration: none; color: var(--cyan-deep); }
  nav.links a.active { background: var(--cyan); color: #fff; }

  /* ---------- Layout ---------- */
  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 28px 20px 64px;
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    aside.side { order: -1; }
  }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(135deg, #ffffff, var(--cyan-soft));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px 28px;
    margin-bottom: 26px;
    box-shadow: var(--shadow);
  }
  .hero h1 { margin: 0 0 8px; font-size: 28px; }
  .hero p { margin: 0; color: var(--text-soft); }

  /* ---------- Post list ---------- */
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 4px 0 16px;
  }
  .section-title h2 { font-size: 18px; margin: 0; }
  .section-title .count { color: var(--muted); font-size: 13px; }

  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 16px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    cursor: pointer;
  }
  .post-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: #cdeef0;
  }
  .post-card h3 { margin: 0 0 6px; font-size: 19px; color: var(--text); }
  .post-card .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .post-card .excerpt { color: var(--text-soft); font-size: 15px; margin: 0 0 12px; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    display: inline-block;
    padding: 3px 11px;
    font-size: 12.5px;
    border-radius: 999px;
    background: var(--cyan-soft);
    color: var(--cyan-deep);
    cursor: pointer;
    user-select: none;
  }
  .tag:hover { background: var(--cyan); color: #fff; }
  .tag.active { background: var(--cyan); color: #fff; }

  /* ---------- Sidebar ---------- */
  aside.side .box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px;
    margin-bottom: 18px;
  }
  aside.side .box h4 {
    margin: 0 0 12px; font-size: 14px; color: var(--text-soft);
    letter-spacing: .04em;
  }
  aside.side .box .tags a { text-decoration: none; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- Post detail ---------- */
  .back {
    display: inline-block; margin-bottom: 18px; font-size: 14px; color: var(--cyan-deep);
  }
  article.post {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px 36px;
    box-shadow: var(--shadow);
  }
  article.post h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.3; }
  article.post .meta { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  article.post .body { font-size: 16px; color: var(--text); }
  .body h2 { margin-top: 30px; padding-bottom: 6px; border-bottom: 2px solid var(--cyan-soft); }
  .body h3 { margin-top: 22px; }
  .body img { max-width: 100%; border-radius: 10px; }
  .body pre {
    background: #0f1b24; color: #e6f1f3; padding: 16px 18px;
    border-radius: 10px; overflow: auto; font-size: 14px; line-height: 1.6;
  }
  .body code { background: var(--cyan-soft); color: var(--cyan-deep); padding: 2px 6px; border-radius: 5px; font-size: 90%; }
  .body pre code { background: none; color: inherit; padding: 0; }
  .body blockquote {
    margin: 16px 0; padding: 10px 18px;
    border-left: 4px solid var(--cyan); background: var(--cyan-soft);
    border-radius: 0 8px 8px 0; color: var(--text-soft);
  }
  .body table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  .body th, .body td { border: 1px solid var(--border); padding: 8px 12px; }
  .body th { background: var(--cyan-soft); }
  .body hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }

  /* ---------- About ---------- */
  .about {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px 36px;
    box-shadow: var(--shadow);
  }
  .about h1 { margin-top: 0; }
  .about .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 34px; font-weight: 700; margin-bottom: 16px;
  }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  footer.site {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 26px 20px 40px;
  }
</style>
</head>
<body>
  <header class="site">
    <div class="nav-inner">
      <a class="brand" href="#/" aria-label="我的小站首页">
        <span class="dot"></span> 我的小站
      </a>
      <nav class="links" id="nav">
        <a href="#/" data-route="home">首页</a>
        <a href="#/tags" data-route="tags">标签</a>
        <a href="#/about" data-route="about">关于</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app"><!-- 视图渲染区 --></main>

  <footer class="site">
    © <span id="year"></span> 我的小站 · 用 ❤️ 与 Markdown 搭建
  </footer>

  <!-- 本地内置的 Markdown 解析器（离线可用） -->
  <script src="marked.min.js"></script>
  <script>
  /* =========================================================
   *  文章数据
   *  想新增文章：在 POSTS 数组里加一项即可。
   *  id 唯一、tags 为字符串数组、content 为 Markdown 文本。
   * ======================================================= */
  const POSTS = [
    {
      id: "hello-world",
      title: "你好，世界 —— 开站第一篇",
      date: "2026-09-10",
      tags: ["随笔", "公告"],
      excerpt: "终于动手搭起了属于自己的小站。这里会记录技术、生活与读书的点滴。",
      content: `# 你好，世界

这是「我的小站」的第一篇文章。拖了很久，今天终于把站点搭起来了。

## 为什么要写博客

- 把脑子里的想法**落字**，思路会更清晰
- 给自己留一份可检索的**成长档案**
- 顺便练习一下 Markdown 写作

> 写作是思考的延伸。

## 这个小站能做什么

1. 文章列表
2. 文章详情（支持 Markdown 渲染）
3. 按标签分类筛选
4. 关于页面

\`\`\`js
// 一段示例代码
function greet(name) {
  return "你好，" + name + "！";
}
console.log(greet("小雪"));
\`\`\`

接下来，慢慢填坑。🌱`
    },
    {
      id: "markdown-guide",
      title: "十分钟上手 Markdown",
      date: "2026-09-12",
      tags: ["教程", "技术"],
      excerpt: "从标题到表格，一篇笔记带你掌握写博客最常用的 Markdown 语法。",
      content: `# 十分钟上手 Markdown

Markdown 是一种轻量级标记语言，用纯文本就能写出漂亮的排版。

## 常用语法

### 标题

用 \`#\` 到 \`######\` 表示一到六级标题。

### 强调

**加粗**、*斜体*、\`行内代码\`。

### 列表

无序列表用 \`-\` 或 \`*\`：

- 苹果
- 香蕉
- 橙子

有序列表用数字：

1. 第一步
2. 第二步

### 引用

> 引用一段名言或备注，前面加 \`>\`。

### 表格

| 语法 | 说明 |
| --- | --- |
| \`#\` | 标题 |
| \`**\` | 加粗 |
| \`>\` | 引用 |

### 链接与图片

[访问我的小站](#/)

![示意图](https://via.placeholder.com/640x200.png?text=Markdown+Demo)

搞定这些，写博客就够用啦！`
    },
    {
      id: "reading-notes",
      title: "最近在读的几本书",
      date: "2026-09-14",
      tags: ["读书", "生活"],
      excerpt: "碎片时间里的阅读清单，以及一点点感想。",
      content: `# 最近在读的几本书

时间紧张，阅读全靠挤碎片。这几本是本月正在翻的：

## 《活着》

余华的经典。每次重读都有新的触动——**活着本身就有力量**。

## 《人类简史》

从认知革命讲到科学革命，视角宏大，非常适合通勤时听。

## 一点感想

> 读书不一定为了有用，有时候只是为了在别人的故事里，短暂地离开自己的生活。

下次想试试推理小说，欢迎留言推荐 🙌`
    },
    {
      id: "frontend-tips",
      title: "前端小白也能懂的三件事",
      date: "2026-09-16",
      tags: ["技术", "教程"],
      excerpt: "HTML、CSS、JS 到底各自负责什么？一张图讲明白。",
      content: `# 前端小白也能懂的三件事

很多人被「前端」吓到，其实它只做三件事：

## 1. HTML —— 结构

决定页面有什么：标题、段落、图片、按钮。

\`\`\`html
<h1>标题</h1>
<p>一段文字</p>
\`\`\`

## 2. CSS —— 样式

决定长什么样：颜色、间距、圆角。

\`\`\`css
h1 { color: #16b8c4; }
\`\`\`

## 3. JavaScript —— 行为

决定能干什么：点击、切换、渲染。

\`\`\`js
document.querySelector("h1").textContent = "改好了";
\`\`\`

三件事配合，就构成了你眼前的这个博客页面。是不是没那么神秘？😉`
    },
    {
      id: "daily-life",
      title: "福州的秋天，和一杯手冲",
      date: "2026-09-17",
      tags: ["生活", "随笔"],
      excerpt: "在忙碌的间隙，给自己留一点慢下来的理由。",
      content: `# 福州的秋天，和一杯手冲

福州的秋天不算冷，午后的光刚好。

泡一杯手冲，看热气慢慢散开，是一天里最属于自己的十分钟。

- 豆子：耶加雪菲
- 水温：90℃
- 心情：☁️→☀️

> 慢一点，也没关系。

记录于此，提醒未来的自己：照顾好自己，也是正事。`
    }
  ];

  /* ---------- 渲染辅助 ---------- */
  const app = document.getElementById("app");
  const nav = document.getElementById("nav");

  function fmtDate(s) {
    // s: YYYY-MM-DD
    return s.replace(/-/g, " / ");
  }

  function allTags() {
    const set = new Map();
    POSTS.forEach(p => (p.tags || []).forEach(t => set.set(t, (set.get(t) || 0) + 1)));
    return [...set.entries()].sort((a, b) => b[1] - a[1]);
  }

  function tagUrl(t) { return "#/tag/" + encodeURIComponent(t); }

  function tagChips(tags, activeTag) {
    return `<div class="tags">` + tags.map(t =>
      `<a class="tag${t === activeTag ? " active" : ""}" href="${tagUrl(t)}">${t}</a>`
    ).join("") + `</div>`;
  }

  function postCard(p, activeTag) {
    return `<article class="post-card" data-id="${p.id}">
      <h3>${p.title}</h3>
      <div class="meta">${fmtDate(p.date)}</div>
      <p class="excerpt">${p.excerpt || ""}</p>
      ${tagChips(p.tags, activeTag)}
    </article>`;
  }

  function renderList(posts, title, countText, activeTag) {
    const cards = posts.length
      ? posts.map(p => postCard(p, activeTag)).join("")
      : `<div class="empty">这里还没有文章～</div>`;
    return `
      <div>
        <div class="hero">
          <h1>我的小站</h1>
          <p>记录技术、生活与读书 —— 用 Markdown 写下的每一篇。</p>
        </div>
        <div class="section-title">
          <h2>${title}</h2>
          <span class="count">${countText}</span>
        </div>
        ${cards}
      </div>` + sidebar();
  }

  function sidebar(activeTag) {
    const tags = allTags().map(([t, n]) =>
      `<a class="tag${t === activeTag ? " active" : ""}" href="${tagUrl(t)}">${t} <span style="opacity:.7">${n}</span></a>`
    ).join("");
    return `<aside class="side">
      <div class="box">
        <h4>标签分类</h4>
        <div class="tag-list">${tags}</div>
      </div>
      <div class="box">
        <h4>关于本站</h4>
        <p style="margin:0;color:var(--text-soft);font-size:14px">
          一个纯前端、离线可用的个人博客模板，支持 Markdown 渲染与标签筛选。
        </p>
      </div>
    </aside>`;
  }

  function renderDetail(id) {
    const p = POSTS.find(x => x.id === id);
    if (!p) return renderNotFound();
    const html = (window.marked ? marked.parse(p.content) : "<p>（Markdown 解析器未加载）</p>");
    return `<div style="grid-column:1 / -1">
      <a class="back" href="#/">← 返回文章列表</a>
      <article class="post">
        <h1>${p.title}</h1>
        <div class="meta">${fmtDate(p.date)}</div>
        ${tagChips(p.tags)}
        <div class="body" style="margin-top:18px">${html}</div>
      </article>
    </div>`;
  }

  function renderTags() {
    const tags = allTags();
    const body = tags.map(([t, n]) =>
      `<a class="tag" href="${tagUrl(t)}" style="font-size:15px;padding:8px 16px">${t} <span style="opacity:.7">${n}</span></a>`
    ).join("");
    return `<div style="grid-column:1 / -1">
      <div class="section-title"><h2>全部标签</h2><span class="count">共 ${tags.length} 个</span></div>
      <div class="tags" style="gap:12px">${body}</div>
    </div>` + sidebar();
  }

  function renderAbout() {
    return `<div style="grid-column:1 / -1">
      <div class="about">
        <div class="avatar">雪</div>
        <h1>关于我的小站</h1>
        <p>你好，我是小雪 👋。这是我的个人小站，用来记录技术学习、生活碎片和读书感想。</p>
        <h2>这个小站</h2>
        <ul>
          <li>纯前端实现，<strong>离线可用</strong>，双击即可打开</li>
          <li>文章用 <strong>Markdown</strong> 书写，渲染清晰</li>
          <li>支持<strong>标签分类</strong>与筛选</li>
          <li>青色极简风，手机电脑都好看</li>
        </ul>
        <h2>联系我</h2>
        <p>欢迎在文章下留言交流，或邮件找我聊天 📮</p>
        <p style="color:var(--muted);font-size:14px">—— 写于福州，一个普通的秋天</p>
      </div>
    </div>`;
  }

  function renderNotFound() {
    return `<div style="grid-column:1 / -1" class="empty">
      <h2>没有找到这篇文文章 🥲</h2>
      <p><a href="#/">回到首页</a></p>
    </div>`;
  }

  /* ---------- 路由 ---------- */
  function setActive(route) {
    [...nav.querySelectorAll("a")].forEach(a =>
      a.classList.toggle("active", a.dataset.route === route));
  }

  function router() {
    const hash = location.hash || "#/";
    const parts = hash.replace(/^#\//, "").split("/"); // "" | "post/xxx" | "tag/xxx" | "tags" | "about"
    const [head, param] = parts;

    if (head === "" || head === "home") {
      const posts = [...POSTS].sort((a, b) => b.date.localeCompare(a.date));
      app.innerHTML = renderList(posts, "最新文章", `共 ${posts.length} 篇`, null);
      setActive("home");
    } else if (head === "post") {
      app.innerHTML = renderDetail(decodeURIComponent(param));
      setActive("");
    } else if (head === "tag") {
      const tag = decodeURIComponent(param);
      const posts = POSTS.filter(p => (p.tags || []).includes(tag))
        .sort((a, b) => b.date.localeCompare(a.date));
      app.innerHTML = renderList(posts, `标签：${tag}`, `共 ${posts.length} 篇`, tag);
      setActive("tags");
    } else if (head === "tags") {
      app.innerHTML = renderTags();
      setActive("tags");
    } else if (head === "about") {
      app.innerHTML = renderAbout();
      setActive("about");
    } else {
      app.innerHTML = renderNotFound();
      setActive("");
    }
    window.scrollTo({ top: 0 });
  }

  // 卡片点击跳转详情
  app.addEventListener("click", (e) => {
    const card = e.target.closest(".post-card");
    if (card && card.dataset.id) {
      location.hash = "#/post/" + card.dataset.id;
    }
  });

  window.addEventListener("hashchange", router);
  document.getElementById("year").textContent = new Date().getFullYear();
  router();
  </script>
</body>
</html>
